# ==============================================================================
# Gradle Properties - Production Build Configuration
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. JVM & Memory Management
# ------------------------------------------------------------------------------
# Optimize JVM heap size and Garbage Collector for fast parallel compilation
org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC -XX:MaxGCPauseMillis=100 -XX:+UseStringDeduplication -Dfile.encoding=UTF-8

# ------------------------------------------------------------------------------
# 2. Build Execution & Caching
# ------------------------------------------------------------------------------
# Enable parallel execution across modules
org.gradle.parallel=true

# Enable build caching to reuse task outputs between builds
org.gradle.caching=true

# Enable configuration caching to accelerate build start time
org.gradle.configuration-cache=true

# File system watching to speed up incremental builds
org.gradle.vfs.watch=true

# Limit maximum worker threads to prevent host resource exhaustion
org.gradle.workers.max=4

# ------------------------------------------------------------------------------
# 3. Kotlin Compiler Settings
# ------------------------------------------------------------------------------
# Set official Kotlin code style
kotlin.code.style=official

# Execute Kotlin compiler in-process for speed and daemon stability
kotlin.compiler.execution.strategy=in-process

# Enable incremental Kotlin compilation
kotlin.incremental=true

# Kotlin daemon JVM arguments
kotlin.daemon.jvmargs=-Xmx2g

# ------------------------------------------------------------------------------
# 4. Android Gradle Plugin (AGP) Optimizations
# ------------------------------------------------------------------------------
# Enable AndroidX support
android.useAndroidX=true

# Reduce R class size by enforcing non-transitive R classes
android.nonTransitiveRClass=true

# Disallow legacy Kotlin source sets structure
android.disallowKotlinSourceSets=false
